<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- rays: eight soft pink dashes around the sun -->
  <g stroke="#FF85A2" stroke-width="7" stroke-linecap="round">
    <line x1="50" y1="8" x2="50" y2="17" transform="rotate(0 50 50)"/>
    <line x1="50" y1="8" x2="50" y2="17" transform="rotate(45 50 50)"/>
    <line x1="50" y1="8" x2="50" y2="17" transform="rotate(90 50 50)"/>
    <line x1="50" y1="8" x2="50" y2="17" transform="rotate(135 50 50)"/>
    <line x1="50" y1="8" x2="50" y2="17" transform="rotate(180 50 50)"/>
    <line x1="50" y1="8" x2="50" y2="17" transform="rotate(225 50 50)"/>
    <line x1="50" y1="8" x2="50" y2="17" transform="rotate(270 50 50)"/>
    <line x1="50" y1="8" x2="50" y2="17" transform="rotate(315 50 50)"/>
  </g>
  <!-- face disc -->
  <circle cx="50" cy="50" r="28" fill="#FF85A2"/>
  <!-- soft highlight -->
  <ellipse cx="41" cy="36" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.55" transform="rotate(-30 41 36)"/>
  <!-- cheeks -->
  <circle cx="34" cy="57" r="4.5" fill="#FF4F7E" opacity="0.6"/>
  <circle cx="66" cy="57" r="4.5" fill="#FF4F7E" opacity="0.6"/>
  <!-- eyes: happy closed arcs -->
  <path d="M 36 47 Q 42 39 48 47" fill="none" stroke="#5A1A33" stroke-width="4" stroke-linecap="round"/>
  <path d="M 52 47 Q 58 39 64 47" fill="none" stroke="#5A1A33" stroke-width="4" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M 42 58 Q 50 66 58 58" fill="none" stroke="#5A1A33" stroke-width="4" stroke-linecap="round"/>
</svg>
